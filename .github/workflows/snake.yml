name: Generate Snake

on:
  # Berjalan otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *"
  
  # Memungkinkan Anda menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:
  
  # Berjalan otomatis setiap ada perubahan di branch main/master
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Langkah 1: Mengambil kode dari repositori Anda
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Membuat animasi ular (menggunakan kode Anda yang sudah diperbaiki)
      - name: Generate GitHub Animation Snake
        uses: Platane/snk@v3
        with:
          github_user_name: IvanderTheo
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      # Langkah 3: Menyimpan hasil animasi (.svg & .gif) ke branch output agar bisa dipanggil di README
      - name: Push GitHub Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
